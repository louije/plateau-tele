<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="view-transition" content="same-origin" />
    <title>plateau-télé</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <div class="hero">
      <img src="/plateau-tele.png" alt="plateau-télé" class="hero__logo" />
    </div>

    <main>
      <search-bar></search-bar>
      <watch-list></watch-list>
    </main>

    <!-- Templates -->

    <template id="search-result-tpl">
      <li class="search-result" role="option">
        <a class="search-result__link" href="">
          <img class="search-result__poster" alt="" loading="lazy" />
          <div class="search-result__info">
            <span class="search-result__title"></span>
            <span class="search-result__subtitle"></span>
            <span class="search-result__meta"></span>
          </div>
        </a>
      </li>
    </template>

    <template id="watch-item-tpl">
      <li class="watch-item">
        <a class="watch-item__link" href="">
          <img class="watch-item__poster" alt="" loading="lazy" crossorigin="anonymous" />
          <div class="watch-item__body">
            <strong class="watch-item__title"></strong>
            <span class="watch-item__subtitle"></span>
            <span class="watch-item__meta"></span>
            <span class="watch-item__director"></span>
            <p class="watch-item__note"></p>
          </div>
        </a>
        <span class="watch-item__added-by"></span>
        <span class="watch-item__handle" aria-hidden="true"></span>
      </li>
    </template>
  </body>
</html>
